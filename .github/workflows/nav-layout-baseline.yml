name: Navigation layout baseline
on:
  pull_request:
    paths:
      - 'qa/nav-alignment/**'
      - '.github/workflows/nav-layout-baseline.yml'
permissions:
  contents: read
jobs:
  capture-pinned-baseline:
    if: github.head_ref == 'ui/nav-alignment-weight'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: econDS/ro-leveling-map
          ref: 87b50f729270cc134c7094e169e34d02f2d2ae27
          path: .nav-qa-apps/leveling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: econDS/ro-reform-preparation
          ref: b49eeb427e3874d6462d922e2b07c52e1a297759
          path: .nav-qa-apps/reform
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: econDS/dim_glacier_planner
          ref: 92e2ee6e484d8901168c86e8625b2463e8e186d7
          path: .nav-qa-apps/dim
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: econDS/ro-best-status
          ref: 3b7dd2ce37a8b3844a9a7774dda6caae2ff3fc0a
          path: .nav-qa-apps/best
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: econDS/sessrumnir-ocean-week-guide
          ref: 159a9d12ee1d1f2e6713297fcbd379952f1b69ab
          path: .nav-qa-apps/ocean
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture untouched app defaults and real layout
        run: node qa/nav-alignment/capture-nav-layout.mjs --config qa/nav-alignment/apps.json --out qa-results/nav-alignment-before --stage before
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nav-alignment-before-${{ github.sha }}
          path: qa-results/nav-alignment-before/
          if-no-files-found: error
